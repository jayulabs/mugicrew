name: pages

on:
  push:
    branches: [main]
    # every source the site renders: a doc or glossary edit redeploys without touching site/
    paths:
      - 'site/**'
      - 'docs/install.md'
      - 'docs/configuration.md'
      - 'docs/gitlab.md'
      - 'docs/jira.md'
      - 'GLOSSARY.md'
      - 'main.go'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install and test the site
        working-directory: site
        run: |
          npm ci
          npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
